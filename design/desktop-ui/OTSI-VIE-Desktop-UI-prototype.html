<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OTSI VIE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
:root{--bg:#0A0B0D;--p0:#0F1114;--p1:#14171B;--p2:#1A1E23;--p3:#22272D;--ln:#252A31;--ln2:#333942;--tx:#ECEEF1;--tx2:#B9BFC8;--mu:#8E96A1;--ac:#2BD4B0;--ac-ink:#04201A;--blue:#78ACFF;--amber:#EDB54F;--red:#FF8073;--sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace}
*{box-sizing:border-box}
html,body{width:100%}
x-dc{display:block;width:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:400 13px/20px var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss03","tnum"}
h1,h2,h3,h4,p,ul,ol{margin:0;padding:0}
ul,ol{list-style:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
a{color:var(--ac);text-decoration:none}a:hover{color:#6BE6CC}

/* shell */
.app{display:flex;flex-direction:column;width:100%;min-width:0;min-height:900px;background:var(--bg)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:48px;padding:6px 10px;background:var(--p0);border-bottom:1px solid var(--ln)}
.brand{display:flex;align-items:center;gap:10px;height:32px;padding:0 14px 0 4px;border-right:1px solid var(--ln);color:var(--tx)}
.brand:hover{color:var(--tx)}
.mark{width:22px;height:22px;border-radius:5px;background:var(--ac);display:grid;place-items:center;color:var(--ac-ink)}
.mark svg{width:14px;height:14px;stroke-width:2.2}
.wm{font-weight:600;font-size:12px;letter-spacing:.14em}
.wm span{color:var(--mu);font-weight:500;letter-spacing:.08em;margin-left:6px}
.ctx{display:flex;flex-wrap:wrap;align-items:center;gap:2px;flex:1 1 420px;min-width:0}
.ctxb{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:6px;background:transparent;border:1px solid transparent;cursor:pointer;white-space:nowrap}
.ctxb:hover{background:var(--p2);border-color:var(--ln)}
.ctxb .k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);font-weight:600}
.ctxb .v{color:var(--tx);font-weight:500}
.ctxb .v.none{color:var(--mu);font-weight:400}
.sep{color:var(--ln2);font-size:14px}
.search{display:inline-flex;align-items:center;gap:8px;height:32px;min-width:260px;padding:0 8px 0 10px;border-radius:6px;background:var(--p2);border:1px solid var(--ln);color:var(--mu);cursor:pointer}
.search .grow{flex:1;text-align:left}
.kbd{font:500 12px/1 var(--mono);color:var(--tx2);padding:3px 5px;border:1px solid var(--ln2);border-bottom-width:2px;border-radius:4px;background:var(--p1)}
.ib{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:6px;background:transparent;border:1px solid transparent;color:var(--tx2);cursor:pointer;position:relative}
.ib:hover{background:var(--p2);border-color:var(--ln);color:var(--tx)}
.ib .n{position:absolute;top:2px;right:0;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--ac);color:var(--ac-ink);font:600 11px/16px var(--sans);font-variant-numeric:tabular-nums;text-align:center}
.av{width:28px;height:28px;border-radius:50%;background:var(--p3);border:1px solid var(--ln2);display:grid;place-items:center;color:var(--mu)}
.av svg{width:15px;height:15px}
.body{flex:1 1 auto;display:flex;flex-wrap:wrap;min-height:0;align-items:stretch}
.side{flex:1 1 260px;max-width:300px;background:var(--p0);border-right:1px solid var(--ln);display:flex;flex-direction:column;min-width:0}
.insp{flex:1 1 280px;max-width:340px;background:var(--p0);border-left:1px solid var(--ln);display:flex;flex-direction:column;min-width:0}
.content{flex:999 1 560px;min-width:0;display:flex;flex-direction:column}
.pages{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 16px;min-height:58px;padding:0 10px;background:var(--p0);border-top:1px solid var(--ln)}
.pg{display:flex;flex-wrap:wrap;gap:0}
.pt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-width:74px;height:58px;padding:0 6px;color:var(--mu);font-size:12px;font-weight:500;border-top:2px solid transparent;margin-top:-1px}
.pt:hover{color:var(--tx)}
.pt.on{color:var(--tx);border-top-color:var(--ac)}
.pt.on .i{color:var(--ac)}
.status{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;font-size:12px;color:var(--mu)}
.st{display:inline-flex;align-items:center;gap:6px}
.led{width:6px;height:6px;border-radius:50%;background:var(--mu)}
.led.ok{background:var(--ac)}
.led.warn{background:var(--amber)}

/* icons */
.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.i.s{width:14px;height:14px}
.i.l{width:22px;height:22px}

/* type */
.eb{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.h1{font-size:16px;font-weight:600;letter-spacing:-.005em;line-height:24px}
.h2{font-size:14px;font-weight:600;line-height:20px}
.h3{font-size:13px;font-weight:600;line-height:20px}
.sub{color:var(--tx2)}
.mu{color:var(--mu)}
.sm{font-size:12px;line-height:18px}
.xs{font-size:12px;line-height:18px}
.mono{font-family:var(--mono);font-feature-settings:normal;letter-spacing:0}
.slot{font-family:var(--mono);font-feature-settings:normal;color:var(--mu);font-size:.92em}
.nm{color:var(--mu);font-size:12px;line-height:18px;font-weight:400;font-style:italic}

/* surfaces */
.panel{background:var(--p1);border:1px solid var(--ln);border-radius:8px;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:38px;padding:0 12px;border-bottom:1px solid var(--ln)}
.pb{padding:14px}
.sect{padding:14px;border-bottom:1px solid var(--ln);display:flex;flex-direction:column;gap:10px}
.lr{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 12px;border-bottom:1px solid var(--ln)}
.lr:last-child{border-bottom:0}
.lr.sel{background:rgba(43,212,176,.07);box-shadow:inset 2px 0 0 var(--ac)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;font-size:13px;line-height:20px;align-items:center}
.kv dt{color:var(--mu)}
.kv dd{margin:0;text-align:right}
.div{height:1px;background:var(--ln)}
.skel{display:inline-block;height:8px;border-radius:3px;background:var(--p3)}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:6px;border:1px solid var(--ln2);background:var(--p2);color:var(--tx);font:600 13px/20px var(--sans);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--p3);color:var(--tx)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--ac-ink);font-weight:600}
.btn.pri:hover{background:#45DDBD;color:var(--ac-ink)}
.btn.gh{background:transparent;border-color:transparent;color:var(--tx2)}
.btn.gh:hover{background:var(--p2);color:var(--tx)}
.btn.dan{color:var(--red)}
.btn.sm{height:30px;padding:0 10px}
.btn.lg{height:44px;padding:0 20px}
.btn.w{width:100%}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;line-height:16px;font-weight:500;border:1px solid var(--ln2);color:var(--tx2);white-space:nowrap;background:var(--p1)}
.ev::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.ev-c{color:var(--ac);border-color:rgba(43,212,176,.38);background:rgba(43,212,176,.08)}
.ev-d{color:var(--blue);border-color:rgba(120,172,255,.38);background:rgba(120,172,255,.08)}
.ev-i{color:var(--amber);border-color:rgba(237,181,79,.38);background:rgba(237,181,79,.08)}
.ev-n{color:var(--mu);border-style:dashed;background:transparent}
.ev-n::before{background:transparent;border:1px solid currentColor;width:5px;height:5px}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:4px;font:600 12px/16px var(--sans);letter-spacing:.04em;text-transform:uppercase;background:var(--p3);color:var(--tx2)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.lab{font-size:12px;line-height:16px;font-weight:500;color:var(--mu)}
.hint{font-size:12px;line-height:18px;color:var(--mu)}
.in{height:36px;padding:0 10px;border-radius:6px;border:1px solid var(--ln2);background:var(--p0);color:var(--tx);font:400 13px/20px var(--sans);width:100%;min-width:0}
textarea.in{height:auto;padding:8px 10px;resize:vertical;line-height:1.5}
select.in{appearance:none;background-image:none;cursor:pointer}
.in:focus{outline:2px solid var(--ac);outline-offset:-1px;border-color:transparent}
.in::placeholder{color:#7D8590}
.seg{display:inline-flex;padding:2px;border-radius:7px;background:var(--p0);border:1px solid var(--ln);gap:2px}
.seg button{height:28px;padding:0 12px;border:0;border-radius:5px;background:transparent;color:var(--mu);font:500 13px/20px var(--sans);cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--tx)}
.seg button.on{background:var(--p3);color:var(--tx);box-shadow:inset 0 0 0 1px var(--ln2)}
.seg.f{display:flex}.seg.f button{flex:1}
.tabs{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--ln);padding:0 8px}
.tab{height:38px;padding:0 10px;border:0;background:transparent;color:var(--mu);font:500 13px/20px var(--sans);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer}
.tab:hover{color:var(--tx)}
.tab.on{color:var(--tx);border-bottom-color:var(--ac)}
.sw{width:32px;height:18px;flex:none;border-radius:999px;background:var(--p3);border:1px solid var(--ln2);position:relative;cursor:pointer;padding:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--mu)}
.sw.on{background:var(--ac);border-color:var(--ac)}
.sw.on::after{left:16px;background:var(--ac-ink)}
.radio{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:8px;border:1px solid var(--ln);background:var(--p1);cursor:pointer;text-align:left;width:100%}
.radio:hover{border-color:var(--ln2)}
.radio .o{width:16px;height:16px;flex:none;margin-top:1px;border-radius:50%;border:1.5px solid var(--ln2)}
.radio.on{border-color:var(--ac);background:rgba(43,212,176,.06)}
.radio.on .o{border:5px solid var(--ac)}
.cb{width:16px;height:16px;flex:none;border-radius:4px;border:1.5px solid var(--ln2);display:grid;place-items:center;color:var(--ac-ink)}
.cb.on{background:var(--ac);border-color:var(--ac)}
.cb.on svg{width:11px;height:11px;stroke-width:2.6}

/* empty states */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:28px 20px}
.empty .ei{width:44px;height:44px;border-radius:10px;border:1px dashed var(--ln2);display:grid;place-items:center;color:var(--mu);margin-bottom:2px}
.empty h3{font-size:13px;line-height:20px;font-weight:600}
.empty p{max-width:340px;font-size:12px;line-height:18px;color:var(--mu)}

/* media */
.frame{position:relative;background:#050607;border:1px solid var(--ln);border-radius:6px;overflow:hidden;aspect-ratio:16/9;width:100%}
.tc{font:500 12px/16px var(--mono);font-variant-numeric:tabular-nums;color:var(--tx)}
.ruler{display:flex;justify-content:space-between;font:500 12px/16px var(--mono);color:var(--mu)}

@media (max-width:760px){.search{min-width:0;flex:1 1 100%}.side,.insp{max-width:none;border:0;border-bottom:1px solid var(--ln)}.status{display:none}.pt{min-width:60px}}

/* stepper */
.steps{display:flex;flex-wrap:wrap;gap:0;padding:18px 14px 16px}
.stp{flex:1 1 110px;min-width:0;display:flex;flex-direction:column;gap:8px;position:relative;padding-right:10px}
.stp .node{display:flex;align-items:center;gap:0}
.stp .dotn{width:22px;height:22px;flex:none;border-radius:50%;border:1.5px solid var(--ln2);background:var(--p1);display:grid;place-items:center;font:600 12px var(--mono);color:var(--tx2)}
.stp .bar{flex:1;height:1.5px;background:var(--ln2);margin-left:6px}
.stp:last-child .bar{display:none}
.stp .nm2{font-weight:600;font-size:13px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stp.run .dotn{border-color:var(--blue);color:var(--blue)}
.stp.done .dotn{border-color:var(--ac);background:var(--ac);color:var(--ac-ink)}
.stp.fail .dotn{border-color:var(--red);color:var(--red)}

/* ---- v2: metric, rail shell, status bar, overlays, video player ---- */
.metric{font:600 20px/28px var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.01em;color:var(--tx)}
.app{position:relative}
.shell{flex-direction:row;align-items:stretch}
.rail{flex:0 0 240px;width:240px;min-width:0;background:var(--p0);border-right:1px solid var(--ln);display:flex;flex-direction:column}
.rh{height:48px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--ln);color:var(--tx)}
.rh:hover{color:var(--tx)}
.rh .lf{height:22px;width:auto;display:block}
.rh .lm{height:24px;width:auto;display:none}
.rh .wm2{font:600 12px/16px var(--sans);letter-spacing:.14em;color:var(--mu)}
.rn{display:flex;flex-direction:column;gap:2px;padding:10px 8px;flex:1;min-height:0}
.ri{display:flex;align-items:center;gap:12px;height:36px;padding:0 10px;border-radius:6px;color:var(--tx2);font:500 13px/20px var(--sans);white-space:nowrap;overflow:hidden}
.ri:hover{background:var(--p2);color:var(--tx)}
.ri.on{background:var(--p2);color:var(--tx);box-shadow:inset 2px 0 0 var(--ac)}
.ri.on .i{color:var(--ac)}
.ri .adv{margin-left:auto;font:600 12px/16px var(--sans);color:var(--mu);border:1px solid var(--ln2);border-radius:4px;padding:0 5px}
.rsec{font:600 12px/16px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--mu);padding:14px 10px 6px}
.rf{border-top:1px solid var(--ln);padding:8px}
.rt{display:flex;align-items:center;gap:12px;width:100%;height:36px;padding:0 10px;border-radius:6px;border:0;background:transparent;color:var(--mu);font:500 13px/20px var(--sans);cursor:pointer}
.rt:hover{background:var(--p2);color:var(--tx)}
.shell.rc .rail{flex-basis:64px;width:64px}
.shell.rc .rl,.shell.rc .rsec,.shell.rc .wm2,.shell.rc .rh .lf,.shell.rc .ri .adv{display:none}
.shell.rc .rh{justify-content:center;padding:0}
.shell.rc .rh .lm{display:block}
.shell.rc .ri,.shell.rc .rt{justify-content:center;padding:0}
.shell.rc .rt .i{transform:scaleX(-1)}
.shell.rc .rsep{display:block;height:1px;background:var(--ln);margin:8px 6px}
.rsep{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:900px}
.statusbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 16px;min-height:28px;padding:0 14px;background:var(--p0);border-top:1px solid var(--ln);font:400 12px/16px var(--sans);color:var(--mu)}
.statusbar .st b{font-weight:500;color:var(--tx2)}
.scrim{position:absolute;inset:0;background:rgba(5,6,8,.72);z-index:30;display:flex;align-items:center;justify-content:center;padding:24px}
.modal{background:var(--p1);border:1px solid var(--ln2);border-radius:12px;box-shadow:0 24px 80px rgba(0,0,0,.6);width:100%;overflow:hidden;display:flex;flex-direction:column;max-height:100%}
.drawer{position:absolute;top:48px;right:0;bottom:28px;width:420px;max-width:100%;background:var(--p1);border-left:1px solid var(--ln2);box-shadow:-24px 0 60px rgba(0,0,0,.45);z-index:25;display:flex;flex-direction:column}
.vp{position:relative;width:100%;aspect-ratio:16/9;background:#050607;border:1px solid var(--ln);border-radius:6px 6px 0 0;overflow:hidden}
.vp video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.vp .vpe{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px}
.vp .vpo{position:absolute;inset:0;pointer-events:none}
.vpc{display:flex;align-items:center;gap:6px;height:40px;padding:0 8px;background:var(--p1);border:1px solid var(--ln);border-top:0;border-radius:0 0 6px 6px}
.vpc .ib{width:30px;height:30px}
.vps{flex:1;min-width:60px;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:var(--p3);outline-offset:4px}
.vps::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--tx)}
.vps:disabled{opacity:.5}
.vpc select{height:28px;border-radius:5px;border:1px solid var(--ln2);background:var(--p0);color:var(--tx);font:500 12px/16px var(--sans);padding:0 6px}
.toast{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);z-index:40;background:var(--p3);border:1px solid var(--ln2);border-radius:8px;padding:10px 14px;font:400 13px/20px var(--sans);box-shadow:0 12px 40px rgba(0,0,0,.5)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:8px;border:1px solid rgba(255,128,115,.45);background:rgba(255,128,115,.08);color:var(--tx)}
.alert .i{color:var(--red);margin-top:1px}
.bud{position:relative;height:10px;border-radius:5px;background:var(--p3);overflow:hidden}
.bud .used{position:absolute;left:0;top:0;bottom:0;background:var(--ac)}
@media (max-width:760px){.shell{flex-direction:column}.rail{width:100%;flex-basis:auto;border-right:0;border-bottom:1px solid var(--ln)}.rn{flex-direction:row;flex-wrap:wrap}.rf{display:none}.drawer{width:100%}}
.shell{height:max(900px,100vh)}
.shell .main{min-height:0;height:100%}
.shell .body{min-height:0;overflow:hidden}
.shell .content{overflow:auto}
.shell .side,.shell .insp{overflow:auto}
.shell .body{flex-wrap:nowrap}
.shell .body>*{min-height:0}
@media (max-width:760px){.shell .body{flex-wrap:wrap;overflow:visible}.shell{height:auto}}
/* light theme (owner 2026-11-12): same layout, light surfaces; the switch sits in the top bar */
:root[data-theme=light]{--bg:#F3F4F6;--p0:#FFFFFF;--p1:#FFFFFF;--p2:#F1F3F6;--p3:#E7EAEF;--ln:#E0E3E8;--ln2:#CBD0D8;--tx:#15181C;--tx2:#3B424B;--mu:#68717D;--ac:#0E9F81;--ac-ink:#FFFFFF;--blue:#2F6FDB;--amber:#B7790F;--red:#D2463A}
/* live token counter: the spendable balance from GET /v1/wallet, refreshed every 15 s, on focus and after a spend; opens the Wallet */
.tok{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--ln2);border-radius:6px;background:var(--p2);color:var(--tx);text-decoration:none;font:400 13px/1 var(--sans);white-space:nowrap}
.tok:hover{border-color:var(--ac)}.tok .i{width:16px;height:16px;stroke:var(--amber)}.tok b{font-weight:500;font-variant-numeric:tabular-nums}.tok span{color:var(--mu)}
/* light / dark switch: two-state segmented control, remembered per browser */
.theme{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--ln2);border-radius:6px;background:var(--p0)}
.theme button{display:grid;place-items:center;width:28px;height:24px;border:0;border-radius:4px;background:transparent;color:var(--mu);cursor:pointer}
.theme button[aria-pressed=true]{background:var(--p3);color:var(--tx)}.theme .i{width:15px;height:15px}
/* the video picture stays black in both themes; keep its overlay text and controls light on it */
:root[data-theme=light] .vps,:root[data-theme=light] .vpe{--tx:#ECEEF1;--tx2:#B9BFC8;--mu:#8E96A1;--ln:#252A31;--ln2:#333942;--p2:#1A1E23;--p3:#22272D;color:var(--tx)}
/* resizable sidebars: a 6 px drag edge on the rail and every side panel */
.rsz{position:absolute;top:0;bottom:0;width:6px;z-index:6;cursor:col-resize;touch-action:none}
.rsz-r{right:-3px}.rsz-l{left:-3px}
.rsz:hover,.rsz.on,.rsz:focus-visible{background:var(--ac);opacity:.55;outline:none}
/* the selected item of a page menu (Settings / Admin): moves with aria-current */

110px; font-weight: 500\">Detection<\/span><span style=\"flex: 1; color: var(--tx2)\">Players and ball found in each frame, measured on labelled football footage.<\/span><span style=\"width: 110px\"><span class=\"chip ev ev-n\">Not started<\/span><\/span><\/div>\n<div class=\"lr\" style=\"min-height: 52px; gap: 12px\"><span class=\"mono\" style=\"width: 52px\">G06<\/span><span style=\"width: 110px; font-weight: 500\">Tracking<\/span><span style=\"flex: 1; color: var(--tx2)\">The same person followed over time (HOTA, IDF1, identity switches, camera cuts).<\/span><span style=\"width: 110px\"><span class=\"chip ev ev-n\">Not started<\/span><\/span><\/div>\n<div class=\"lr\" style=\"min-height: 52px; gap: 12px\"><span class=\"mono\" style=\"width: 52px\">G07<\/span><span style=\"width: 110px; font-weight: 500\">Identity<\/span><span style=\"flex: 1; color: var(--tx2)\">No wrong player confirmed; unknowns, referees, substitutes and similar shirt numbers handled.<\/span><span style=\"width: 110px\"><span class=\"chip ev ev-n\">Not started<\/span><\/span><\/div>\n<p class=\"hint\" style=\"padding: 10px 14px\">Next step: register a model in <a href=\"#admin-models\" style=\"color: var(--ac)\">Models &amp; AI<\/a>, then run G05 on a labelled clip. A gate moves to Measuring, then Passed or Failed; a waiver needs a recorded reason.<\/p>\n<\/section>\n<\/main>\n<\/div>\n", "shell": true, "advanced": true, "ctx": {"match": "", "player": ""}}, "admin-compliance": {"title": "Security & Compliance", "html": "<div class=\"body\">\n<nav class=\"side\" aria-label=\"Settings\" style=\"flex: 0 0 248px; max-width: 248px; padding: 14px 10px; gap: 2px\">\n<span class=\"eb\" style=\"padding: 6px 10px 8px\">Settings<\/span>\n<a class=\"lr\" href=\"#settings-preferences\" style=\"border: 0; border-radius: 6px; min-height: 34px; color: var(--tx2)\">Preferences<\/a>\n<a class=\"lr\" href=\"#settings-team\" style=\"border: 0; border-radius: 6px; min-height: 34px; color: var(--tx2)\">Team<\/a>\n< 2 id=\"bk\" class=\"h3\">Backups<\/h2><\/div>\n<div class=\"pb\" style=\"display: flex; flex-direction: column; gap: 6px\"><span class=\"sm\" style=\"color: var(--tx2)\">Each backup with its time, size and whether a restore check passed.<\/span><span class=\"sm mu\">Read from GET /v1/admin/backups. If none is listed, the next step is to run a backup and a restore check before relying on this computer alone.<\/span><\/div>\n<\/section>\n<section id=\"audit\" class=\"panel\" aria-labelledby=\"au\" style=\"display: flex; flex-direction: column\">\n<div class=\"ph\"><h2 id=\"au\" class=\"h3\">Audit log<\/h2><\/div>\n<div class=\"pb\" style=\"display: flex; flex-direction: column; gap: 6px\"><span class=\"sm\" style=\"color: var(--tx2)\">Every approval, rejection, erasure, purge and setting change: who, when, what and the reason given.<\/span><span class=\"sm mu\">Read from GET /v1/admin/audit, newest first.<\/span><\/div>\n<\/section>\n<\/div>\n<\/main>\n<\/div>\n", "shell": true, "advanced": true, "ctx": {"match": "", "player": ""}}, "signin": {"title": "Sign in", "html": "<div class=\"app\" style=\"flex-direction: row; flex-wrap: wrap\">\n<div style=\"flex: 1 1 520px; position: relative; overflow: hidden; background: var(--p0); border-right: 1px solid var(--ln); display: flex; flex-direction: column; justify-content: space-between; padding: 40px 48px; min-height: 360px\">\n\n<div style=\"display: flex; flex-direction: column; gap: 40px\">\n<div style=\"position: relative; display: flex; align-items: center; gap: 16px\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAiAAAAC8CAYAAABBshUNAABSkklEQVR4Xu2dCZwcVbX/zzn3VnXPTBYggYQsJOybsu+C7JAAIoiEp4i4sYSQAOrz7/+JL+Bfnz4X1iwEUXyKIkRQWcISEBBkERB4gsiiQAIkhASyzUx31b33/D+npycmIct0VXVPL/f73pgAU8u9XV31q3PP+R0ET7Z85ucdMHj4YHDRYGAaDAoHA0AOFAYA8kO50gGRI2CMwBQNKCiCc8uA2pdB1L0MOt9fCjd8tjPbE/N4PB6Pp37A+jmVBuK8O4YDwBgAtQ1oHANII4BwGFgeDhoHA2MIwCEwhIAQAIACQAJgKv8p824B0AFwz4+IEYQIQP7kCBwsA7aLAOgdYHgb2M4HwH9Anl6HHxy9QBRMA82Yx+PxeDxr v[—]<\/span>\n<\/div>\n<\/div>\n\n<main style=\"flex: 1 1 560px; min-width: 0; display: flex; align-items: center; justify-content: center; padding: 40px 32px\">\n<form style=\"width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 18px\" aria-labelledby=\"os\">\n<div style=\"display: flex; flex-direction: column; gap: 8px\"><span class=\"chip\" style=\"align-self: flex-start; color: var(--ac); border-color: rgba(43,212,176,.38)\">First run<\/span><h2 id=\"os\" class=\"h1\">Create the owner account<\/h2><p class=\"sub\">The owner manages the organisation, invites the team and confirms token purchases. You can add members after setup.<\/p><\/div>\n<div class=\"field\"><label class=\"lab\" for=\"n\">Full name<\/label><input id=\"n\" class=\"in\" autocomplete=\"name\" style=\"height: 40px\"><\/div>\n<div class=\"field\"><label class=\"lab\" for=\"e\">Email<\/label><input id=\"e\" class=\"in\" type=\"email\" autocomplete=\"email\" placeholder=\"you@club.com\" style=\"height: 40px\"><\/div>\n<div class=\"field\"><label class=\"lab\" for=\"p\">Password<\/label>\n<div style=\"position: relative\"><input id=\"p\" class=\"in\" type=\"password\" autocomplete=\"new-password\" style=\"height: 40px; padding-right: 64px\"><button type=\"button\" class=\"btn sm gh\" style=\"position: absolute; right: 4px; top: 5px; height: 30px\" aria-label=\"Show password\">Show<\/button><\/div>\n<div style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin-top: 4px\"><span style=\"height: 3px; border-radius: 2px; background: var(--p3)\"><\/span><span style=\"height: 3px; border-radius: 2px; background: var(--p3)\"><\/span><span style=\"height: 3px; border-radius: 2px; background: var(--p3)\"><\/span><span style=\"height: 3px; border-radius: 2px; background: var(--p3)\"><\/span><\/div>\n<span class=\"hint\">At least 12 characters. A passphrase works well.<\/span><\/div>\n<button class=\"btn pri lg w\" type=\"submit\">Create owner account<\/butt         var set = function (w) { w = Math.max(lim[0], Math.min(lim[1], Math.round(w))); el.style.flex = "0 0 " + w + "px"; el.style.width = w + "px"; el.style.maxWidth = "none"; return w; };

    players.push(P); if (!state.activePlayer) state.activePlayer = P;

    var seek = $("[data-act=seek]", ctl), tc = $("[data-tc]", ctl), speed = $("[data-act=speed]", ctl);
    function load(file) {
      if (!/\.(mp4|mov)$/i.test(file.name) && !/video\/(mp4|quicktime)/.test(file.type)) { toast("Only MP4 or MOV footage can be opened."); return; }

      v.addEventListener("error", function () { toast("This file could not be played on this computer."); });

    }
    function toggle() { if (!P.video) { input.click(); return; } if (P.video.paused) P.video.play(); else P.video.pause(); }
    P.toggle = toggle; P.open = function () { input.click(); };
    P.step = function (s) { if (P.video) P.video.currentTime = Math.max(0, Math.min(P.video.duration || 0, P.video.currentTime + s)); };
    P.rate = function (dir) { var o = [].slice.call(speed.options).map(function (x) { return x.value; }); var i = o.indexOf(speed.value) + dir; if (i >= 0 && i < o.length) { speed.value = o[i]; if (P.video) P.video.playbackRate = parseFloat(speed.value); toast("Speed " + speed.options[i].text); } };
    P.fullscreen = function () { var el = P.wrap; if (document.fullscreenElement) document.exitFullscreen(); else if (el.requestFullscreen) el.requestFullscreen(); };

    q.addEventListener("keydown", function (e) {
      var vis = $$("#plist [data-pi]");
      if (e.key === "ArrowDown") { palSel = Math.min(vis.length - 1, palSel + 1); drawPalette(); e.preventDefault(); }
      else if (e.key === "ArrowUp") { palSel = Math.max(0, palSel - 1); drawPalette(); e.preventDefault(); }
      else if (e.key === "Tab") { palMode = palMode === "search" ? "assistant" : "search"; syncPm(); drawPalette(); e.preventDefault(); }
      else if (e.key === "Enter") { e.preventDefault(); if (palMode === "assistant") { if (palPending) approve(); else preview(); } else { var el = vis[palSel]; if (el) el.click(); } }
    });
    drawPalette();
  }
  function syncPm() { $$("[data-pm]").forEach(function (b) { b.classList.toggle("on", b.getAttribute("data-pm") === palMode); }); }
  function palMatches() {
    var q = ($("#cq") || {}).value || ""; q = q.toLowerCase().trim();
    return paletteItems().filter(function (it) { return !q || (it.label + " " + (it.sub || "")).toLowerCase().indexOf(q) > -1; });
  }
  function drawPalette() {
    var box = $("#plist"); if (!box) return;
    if (palMode === "assistant") {
      box.innerHTML = palPending ? '<div class="panel" style="padding:14px;margin:8px;display:flex;flex-direction:column;gap:10px"><span class="eb">' + tr("Preview") + '<\/span><span>' + tr("Will run") + ": <b style=\"font-weight:600\">" + esc(palPending.label) + '<\/b><\/span><span class="sm mu">' + tr("Runs locally on this computer. Nothing runs until you approve.") + '<\/span><div style="display:flex;gap:8px"><button class="btn sm pri" type="button" data-pa="approve">' + tr("Approve") + '<\/button><button class="btn sm" type="button" data-pa="discard">' + tr("Discard") + "<\/button><\/div><\/div>"
        : '<p class="sm mu" style="padding:12px">' + tr("Type what you want to do, for example “pause all jobs”, then press Enter to preview it.") + "<\/p>";
      return;
    }
    var list = palMatches(), g = "", i = 0;
    box.innerHTML = list.length ? list.map(function (it) {
      var head = it.g !== g ? '<span class="eb" style="display:block;padding:8px 10px 4px">' + tr(it.g) + "<\/span>" : ""; g = it.g;
      var on = i === palSel; var html = head + '<button type="button" class="lr" data-pi="' + i + '" style="width:100%;border:0;border-radius:6px;background:' + (on ? "#1D2126" : "transparent") + ';min-height:36px;cursor:pointer;text-align:left;color:inherit"><span style="flex:1">' + esc(it.label) + "<\/span>" + (it.sub ? '<span class="sm mu">' + esc(it.sub) + "<\/span>" : "") + "<\/button>"; i++; return html;
    }).join("") : '<p class="sm mu" style="padding:12px">' + tr("No results.") + "<\/p>";
    $$("[data-pi]", box).forEach(function (b) { b.addEventListener("click", function () { var it = list[+b.getAttribute("data-pi")]; closeLayer(); it.run(); }); });
  }
  function preview() { var m = palMatches(); palPending = m.filter(function (x) { return x.g === "Actions" || x.g === "Go to"; })[0] || null; if (!palPending) toast("No local command matches that."); drawPalette(); }
  function approve() { var it = palPending; closeLayer(); if (it) { it.run(); toast(tr("Ran") + ": " + it.label); } }

  /* ---------- global events ---------- */
  document.addEventListener("click", function (e) {
    var t = e.target;
    var a = t.closest("a[href]");
    var sec = a && a.getAttribute("data-section");
    if (sec) {                                                           // Admin menu: go to the section on the Admin page and mark it
      e.preventDefault();
      var go = function () {
        var el = document.getElementById(sec); if (!el) return;
        el.scrollIntoView({ behavior: "smooth", block: "start" });
        el.style.transition = "box-shadow .3s"; el.style.boxShadow = "0 0 0 2px var(--ac)"; setTimeout(function () { el.style.boxShadow = ""; }, 1400);
        var nav = a.closest("nav") || document;
        $$("a[aria-current]", nav).forEach(function (x) { x.removeAttribute("aria-current"); });
        var cur = $('a[data-section="' + sec + '"]', nav) || a; cur.setAttribute("aria-current", "page");
      };
      if (state.route !== "admin") { location.hash = "admin"; setTimeout(go, 120); } else go();
      return;
    }
    if (a) {
      var h = a.getAttribute("href");
      if (h === "#palette" || h === "#jobs" || h === "#shortcuts") { e.preventDefault(); openLayer(h.slice(1)); return; }
      if (h === "#") { e.preventDefault(); toast("This section is not part of the approved screens yet."); return; }
    }
    if (t.closest("[data-scrim]") && t.hasAttribute("data-scrim")) { closeLayer(); return; }
    if (t.closest("[data-close]")) { closeLayer(); return; }
    var ms = t.closest("[data-mode-set]");
    if (ms) { setMode(ms.getAttribute("data-mode-set")); if ($("[data-mode-set]")) openAccount(); return; }
    var th = t.closest("[data-theme-set]");
    if (th) { applyTheme(th.getAttribute("data-theme-set")); if ($('[role="menu"][aria-label="Account"]')) openAccount(); return; }
    var o = t.closest("[data-open]"); if (o) { openLayer(o.getAttribute("data-open")); return; }
    if (t.closest("[data-rail-toggle]")) { toggleRail(); return; }
    var sm = t.closest("[data-set-mode]"); if (sm) { setMode(sm.getAttribute("data-set-mode")); return; }
    var tb = t.closest("[data-tour]"); if (tb) { tourNav(tb.getAttribute("data-tour")); return; }
    var jf = t.closest("[data-jf]"); if (jf) { jobsFilter = jf.getAttribute("data-jf"); $$("[data-jf]").forEach(function (b) { var on = b === jf; b.classList.toggle("on", on); b.setAttribute("aria-selected", String(on)); }); renderJobs(); return; }
    var jb = t.closest("button[data-job]"); if (jb) { jobAction(jb.getAttribute("data-job"), jb.getAttribute("data-id")); return; }
    var pm = t.closest("[data-pm]"); if (pm) { palMode = pm.getAttribute("data-pm"); syncPm(); drawPalette(); $("#cq").focus(); return; }
    var pa = t.closest("[data-pa]"); if (pa) { if (pa.getAttribute("data-pa") === "approve") approve(); else { palPending = null; drawPalette(); } return; }
    var rb = t.closest("[data-rights]"); if (rb) { openRights(rb.getAttribute("data-rights"), rb); return; }
    var up = t.closest('button[aria-label="Upload photo"]'); if (up) { openRights("photo", up); return; }
    var md = t.closest("[data-mode]"); if (md && !t.closest(".modal")) { setMode(md.getAttribute("data-mode")); return; }
    var sw = t.closest(".sw"); if (sw) {
      var on = !sw.classList.contains("on"); sw.classList.toggle("on", on); sw.setAttribute("aria-checked", String(on));
      if (sw.hasAttribute("data-ov")) { state.overlays[sw.getAttribute("data-ov")] = on; applyOverlayState(); }
      return;
    }
    var segb = t.closest(".seg button"); if (segb && !segb.hasAttribute("data-pm")) { $$("button", segb.parentNode).forEach(function (b) { b.classList.toggle("on", b === segb); }); return; }
    var tab = t.closest(".tab"); if (tab && !tab.hasAttribute("data-jf")) { $$(".tab", tab.parentNode).forEach(function (b) { var on = b === tab; b.classList.toggle("on", on); b.setAttribute("aria-selected", String(on)); }); return; }
    var rad = t.closest(".radio"); if (rad) { $$(".radio", rad.parentNode).forEach(function (b) { var on = b === rad; b.classList.toggle("on", on); if (b.hasAttribute("aria-checked")) b.setAttribute("aria-checked", String(on)); if (b.hasAttribute("aria-pressed")) b.setAttribute("aria-pressed", String(on)); }); return; }
    var cbl = t.closest("label"); var cb = t.closest(".cb") || (cbl && $(".cb", cbl));
    if (cb) {
      var con = !cb.classList.contains("on"); cb.classList.toggle("on", con);
      cb.innerHTML = con ? '<svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/><\/svg>' : "";
      if (state.route === "report") { var g = buttonByText("Generate brief"); if (g) g.disabled = !con; }
      return;
    }
    var chipT = t.closest("button.chip[aria-pressed]"); if (chipT) { var cp = chipT.getAttribute("aria-pressed") !== "true"; chipT.setAttribute("aria-pressed", String(cp)); chipT.style.background = cp ? "#22272D" : ""; chipT.style.color = cp ? "#ECEEF1" : ""; return; }
    var b = t.closest("button"); if (!b) return;
    var label = b.textContent.replace(/\s+/g, " ").trim();
    var al = b.getAttribute("aria-label") || "";
    if (al === tr("Show password") || label === tr("Show") || label === tr("Hide")) { var inp = b.parentNode.querySelector("input"); if (inp) { var show = inp.type === "password"; inp.type = show ? "text" : "password"; b.textContent = tr(show ? "Hide" : "Show"); } return; }
    if (label === tr("Approve") && state.route !== "home" && b.closest('section[aria-labelledby="ri"]')) { decide("approve"); return; }
    if (label === tr("Reject…")) { decide("reject"); return; }
    if (label === tr("Review") && b.closest('section[aria-labelledby="ri"]')) { location.hash = "#admin"; return; }
    if (label === tr("Continue to Reel")) { location.hash = "#reels"; return; }
    if (label === tr("Generate brief")) { toast("The AI brief is written by the engine from measured data. Not connected in this prototype."); return; }
    if (label === tr("Claim free grant")) { toast("The free grant is confirmed by the OTSI server. Not connected in this prototype."); return; }
    if (label === tr("Post comment")) {
      var txt = $("#cm"), nm = $("#cn"); if (!txt.value.trim()) { txt.focus(); return; }
      var pl = state.activePlayer, at = pl && pl.video ? fmtTime(pl.video.currentTime) : "00:00";
      state.comments.push({ name: nm.value.trim() || tr("Guest"), text: txt.value.trim(), at: at }); txt.value = ""; renderComments(); return;
    }
    if (label === tr("Build reel") || /^Build reel/.test(label)) { addJob("Build reel", D.players[0].name + " · " + tr("3 minutes"), 10); toast("Reel build queued in the Jobs Center."); return; }
  });
  document.addEventListener("change", function (e) {
    var t = e.target;
    if (t.matches("[data-lang-select]")) { state.lang = t.value; LS.set("otsi.lang", t.value); render(); toast("Language changed."); return; }
    if (t.matches("select[data-job=priority]")) { jobAction("priority", t.getAttribute("data-id"), t.value); }
  });
  document.addEventListener("submit", function (e) {
    e.preventDefault();
    if (state.route === "signin") location.hash = "#home";
    else if (state.route === "setup" || state.route === "invite") { location.hash = "#home"; setTimeout(function () { openTour(); }, 50); }
    else if (state.route === "shared-locked") location.hash = "#shared";
  });
  document.addEventListener("input", function (e) {
    var t = e.target;
    if (t.matches('input[aria-label^="Digit"], input[aria-label^="' + tr("Digit") + '"]') && t.value) { var n = t.nextElementSibling; if (n && n.nodeName === "INPUT") n.focus(); }
  });
  document.addEventListener("keydown", function (e) {
    var mod = e.ctrlKey || e.metaKey, k = e.key;
    if (k === "Escape") { if (layer() && layer().innerHTML) { closeLayer(); e.preventDefault(); } return; }
    if (mod && (k === "k" || k === "K")) { e.preventDefault(); openLayer("palette"); return; }
    if (mod && (k === "b" || k === "B")) { e.preventDefault(); toggleRail(); return; }
    if (mod && (k === "j" || k === "J")) { e.preventDefault(); openLayer("jobs"); return; }
    if (mod && k === ",") { e.preventDefault(); location.hash = "#settings-preferences"; return; }
    if (mod || e.altKey || isTyping(e)) return;
    if (layer() && layer().innerHTML && k !== "?") return;
    if (k === "?") { e.preventDefault(); openLayer("shortcuts"); return; }
    var P = state.activePlayer;
    if (P) {
      if (k === " ") { e.preventDefault(); P.toggle(); return; }
      if (k === "ArrowLeft") { e.preventDefault(); P.step(-1); return; }
      if (k === "ArrowRight") { e.preventDefault(); P.step(1); return; }
      if (k === ",") { P.step(-1 / 25); return; }
      if (k === ".") { P.step(1 / 25); return; }
      if (k === "[") { P.rate(-1); return; }
      if (k === "]") { P.rate(1); return; }
      if (k === "f" || k === "F") { P.fullscreen(); return; }
      if (k === "o" || k === "O") { P.open(); return; }
    }
    var kk = k.toLowerCase();
    if (state.route === "analysis") {
      if (kk === "c") return toast("Chinazom Godwin is already confirmed.");
      if (kk === "e") return toast("Correct identity: select a tracked person on open footage first.");
      if (kk === "x") return toast("Reject identity: select a tracked person on open footage first.");
      if (kk === "m") return toast(P && P.video ? "Marker added at " + fmtTime(P.video.currentTime) + "." : "Open local footage to add a marker.");
    }
    if (state.route === "studio") {
      if (kk === "i" || kk === "p") return toast(P && P.video ? (kk === "i" ? "In" : "Out") + " point at " + fmtTime(P.video.currentTime) + "." : "Open local footage to mark in and out.");
      if (kk === "b" || kk === "v") { var seg = $('[aria-label="Edit tool"]'); if (seg) { var want = kk === "b" ? tr("Blade") : tr("Select"); $$("button", seg).forEach(function (x) { x.classList.toggle("on", x.textContent.trim() === want); }); } return; }
    }
  });

  /* expose for integration & tests */
  window.OTSI = { state: state, validateFile: validateFile, addJob: addJob, tr: tr, render: render, setMode: setMode, NAV: NAV };

  /* boot: splash once per session, then the requested route */
  var first = !sessionStorageGet("otsi.splash");
  function sessionStorageGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return "1"; } }
  if (first && (!location.hash || location.hash === "#home")) { try { sessionStorage.setItem("otsi.splash", "1"); } catch (e) {} location.hash = "#splash"; }
  render();
})();

</script>
</body>
</html>
