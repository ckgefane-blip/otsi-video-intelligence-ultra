<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OTSI VIE — Starting</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: #0A0B0D;
    color: #ECEEF1;
    user-select: none;
    overflow: hidden;
  }
  /* the SOT splash (Splash.dc.html) in the full-screen loading window: the centred logo, the progress
   * bar, "Starting the engine…" with the version, the three start-up steps, and the offline-grace footer.
   * The faint pitch outline sits behind it all, as in the SOT. The steps are NOT in the markup: the main
   * process sends one step event per SOT step and the list below grows from those events. With three
   * steps in a full-screen window the footer sits well clear of the step list. */
  #status-view {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    padding: 24px 32px 44px;
  }
  #status-view .pitch {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 1100px;
    height: auto;
    transform: translate(-50%, -50%);
    opacity: .3;
    pointer-events: none;
  }
  #status-view .inner {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  #status-view .brand { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  #status-view .brand img { height: 84px; width: auto; display: block; }
  .eb {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .26em;
    color: #8E96A1;
  }
  #status-view .prog { width: 100%; display: flex; flex-direction: column; gap: 10px; }
  #status-view .bar { height: 3px; border-radius: 2px; background: #252A31; overflow: hidden; }
  #status-view .bar > div { height: 100%; width: 0%; background: #2BD4B0; border-radius: 2px; transition: width .4s ease; }
  #status-view .bar-row { display: flex; justify-content: space-between; font-size: 13px; }
  #status-view .bar-row .sub { color: #8E96A1; }
  #status-view .bar-row .ver { font-family: ui-monospace, "JetBrains Mono", monospace; color: #8E96A1; }
  #status-view .steps {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
    text-align: left;
    font-size: 13px;
    list-style: none;
    margin: 0;
    padding: 0;
  }
  #status-view .steps li { display: flex; gap: 10px; align-items: center; }
  #status-view .steps .sub { color: #8E96A1; }
  #status-view .steps .mut { color: #8E96A1; }
  #status-view .steps .ok { color: #2BD4B0; flex: none; }
  #status-view .steps .spin {
    width: 14px; height: 14px; flex: none;
    border-radius: 50%;
    border: 1.5px solid #4F9DFF;
    border-right-color: transparent;
    animation: rot 1s linear infinite;
  }
  #status-view .steps .todo {
    width: 14px; height: 14px; flex: none;
    border-radius: 50%;
    border: 1.5px solid #333942;
  }
  #status-view .steps .warn { color: #F2A93B; flex: none; font-weight: 600; }
  @keyframes rot { to { transform: rotate(360deg); } }
  #status-view .foot {
    position: absolute;
    bottom: 24px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 12px;
    color: #8E96A1;
  }
  /* the status view's own small grey text (the bar row) */
  .sub { color: #8E96A1; font-size: 13px; margin: 0 0 22px; }
</style>
</head>
<body>
  <div id="status-view">
    <svg class="pitch" viewBox="0 0 680 440" aria-hidden="true">
      <g fill="none" stroke="#1F2A25" stroke-width="1.2"><rect x="10" y="10" width="660" height="420" rx="4"></rect><rect x="10" y="118" width="108" height="204"></rect><rect x="562" y="118" width="108" height="204"></rect></g>
    </svg>
    <div class="inner">
      <div class="brand">
        <h1 style="margin: 0"><img src="./assets/otsi-logo.png" alt="OTSI" draggable="false"></h1>
        <span class="eb">Video Intelligence Engine</span>
      </div>
      <div class="prog">
        <div class="bar"><div id="bar-fill"></div></div>
        <div class="bar-row"><span class="sub" id="status">Starting the engine…</span><span class="ver" id="version">v[—]</span></div>
      </div>
      <ul class="steps" id="steps"><!-- steps arrive from the main process, one per real start-up stage --></ul>
    </div>
    <p class="foot">Video work runs on this computer · offline grace period applies when the server can’t be reached</p>
  </div>

<script>
  const $ = (id) => document.getElementById(id);

  /* The start-up steps — exactly the SOT's three ("Local workspace opened", "Loading analysis models",
   * "Checking licence"), driven by the step events the main process sends ({ id, label, state }), which
   * map the real stages onto those three. The list starts empty and grows as the steps begin: a step
   * appears when its phase starts, turns done when the next step starts, and warns if its stage fails.
   * Nothing here is hardcoded to a fixed set of steps, and no step is inferred from the status text. */
  const CHECK = '<svg class="ok" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>';
  const SPIN = '<span class="spin" aria-hidden="true"></span>';
  const TODO = '<span class="todo" aria-hidden="true"></span>';
  const WARN = '<span class="warn" aria-hidden="true">!</span>';
  function paintStep(li, state) {
    const icon = li.firstElementChild;
    const label = li.lastElementChild;
    icon.outerHTML = state === 'done' ? CHECK : state === 'active' ? SPIN : state === 'warn' ? WARN : TODO;
    label.className = state === 'done' || state === 'active' || state === 'warn' ? '' : 'mut';
  }
  function renderStep(step) {
    if (!step || !step.id) return;
    // a fresh start after "Try again": the first step arriving again, with later steps already listed
    // from the failed attempt, restarts the list instead of piling a second run onto it
    if (step.id === 'workspace' && step.state === 'active'
      && document.querySelector('#steps [data-step="models"], #steps [data-step="licence"]')) {
      $('steps').innerHTML = '';
    }
    let li = document.querySelector(`#steps [data-step="${step.id}"]`);
    if (!li) {
      li = document.createElement('li');
      li.dataset.step = step.id;
      li.innerHTML = '<span class="todo" aria-hidden="true"></span><span class="mut"></span>';
      $('steps').appendChild(li);
    }
    li.lastElementChild.textContent = step.label || step.id;
    // a new stage starting means every stage before it finished
    if (step.state === 'active') {
      document.querySelectorAll('#steps li').forEach((el) => { if (el !== li) paintStep(el, 'done'); });
    }
    paintStep(li, step.state || 'active');
  }
  function setProgress(pct) { $('bar-fill').style.width = pct + '%'; }
  function applyStatus(text) {
    $('status').textContent = text;
    // the progress bar only: the steps come from the step events, not from this text
    if (/licence expired/i.test(text)) {
      setProgress(70);
    } else if (/opening the engine/i.test(text)) {
      setProgress(100);
    } else if (/starting the engine/i.test(text)) {
      setProgress(90);
    } else if (/checking the licence/i.test(text)) {
      setProgress(70);
    } else if (/models ready|ai models/i.test(text)) {
      setProgress(38);
    } else if (/database/i.test(text)) {
      setProgress(25);
    } else if (/ai runtimes|checking this pc/i.test(text)) {
      setProgress(15);
    } else {
      setProgress(8);
    }
  }

  window.otsi.onStatus((text) => applyStatus(text));
  window.otsi.onStep((step) => renderStep(step));
  // the real version, from the main process; "v[—]" until it answers (the SOT's v[—] slot).
  if (window.otsi.version) {
    window.otsi.version().then((v) => { if (v) $('version').textContent = 'v' + v; }).catch(() => {});
  }
</script>
</body>
</html>
